[pytest]
# Configuración de pytest para el proyecto

# Directorio de tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py *_test.py

# Parámetros de prueba
python_classes = Test*
python_functions = test_*

# Mostrar output más detallado
addopts = 
    -v
    --strict-markers
    --tb=short
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    -W ignore::RuntimeWarning
    -W ignore::SyntaxWarning

# Markers personalizados
markers =
    asyncio: marca test que usa asyncio
    slow: marca test que es lento
    integration: marca test de integración
    unit: marca test unitario
